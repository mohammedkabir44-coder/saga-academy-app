name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '18'
  FLUTTER_VERSION: '3.16'

jobs:
  # Mobile App Tests & Build
  mobile-app-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile-app
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      
      - name: Get Flutter Dependencies
        run: flutter pub get
      
      - name: Run Flutter Analyzer
        run: flutter analyze
      
      - name: Run Flutter Tests
        run: flutter test --coverage
      
      - name: Upload Coverage Reports
        uses: codecov/codecov-action@v3
        with:
          files: ./mobile-app/coverage/lcov.info
          flags: mobile-app
      
      - name: Build Android APK (on main branch)
        if: github.ref == 'refs/heads/main'
        run: flutter build apk --release
      
      - name: Upload Android APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: mobile-app/build/app/outputs/flutter-apk/app-release.apk

  # Backend Tests & Build
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Run Linter
        run: npm run lint
      
      - name: Run Tests with Coverage
        run: npm run test:coverage
      
      - name: Upload Coverage Reports
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage/coverage-final.json
          flags: backend
      
      - name: Build TypeScript
        run: npm run build
      
      - name: Deploy to Firebase (on main branch)
        if: github.ref == 'refs/heads/main'
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

  # Web Dashboard Tests & Build
  web-dashboard-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web-dashboard
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web-dashboard/package-lock.json
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Run Linter
        run: npm run lint
      
      - name: Run Tests with Coverage
        run: npm run test:coverage
      
      - name: Upload Coverage Reports
        uses: codecov/codecov-action@v3
        with:
          files: ./web-dashboard/coverage/coverage-final.json
          flags: web-dashboard
      
      - name: Build Next.js Application
        run: npm run build
      
      - name: Deploy to Firebase Hosting (on main branch)
        if: github.ref == 'refs/heads/main'
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

  # Security Scan
  security-scan:
    runs-on: ubuntu-latest
    needs: [mobile-app-ci, backend-ci, web-dashboard-ci]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run npm audit
        run: |
          cd backend && npm audit --audit-level=high || true
          cd ../web-dashboard && npm audit --audit-level=high || true
      
      - name: Run Dart Pub Audit
        run: |
          cd mobile-app && flutter pub get && dart pub outdated || true

  # Docker Build (Optional)
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-ci, web-dashboard-ci]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/saga-academy-backend:latest
      
      - name: Build and Push Web Dashboard Image
        uses: docker/build-push-action@v5
        with:
          context: ./web-dashboard
          file: ./web-dashboard/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/saga-academy-web:latest
