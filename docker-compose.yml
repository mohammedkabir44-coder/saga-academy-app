version: '3.8'

services:
  # PostgreSQL Database (Local Development with Neon-like setup)
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=saga_academy
      - POSTGRES_PASSWORD=local_dev_password
      - POSTGRES_DB=saga_academy
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga_academy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - DATABASE_URL=postgresql://saga_academy:local_dev_password@postgres:5432/saga_academy
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Web Dashboard
  web-dashboard:
    build:
      context: ./web-dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
    depends_on:
      - backend
    restart: unless-stopped

  # Database Migration Job (Runs once on startup)
  db-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://saga_academy:local_dev_password@postgres:5432/saga_academy
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run db:migrate
    restart: "no"

networks:
  default:
    driver: bridge

volumes:
  postgres_data:
